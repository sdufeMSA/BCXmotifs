[project]
name = "msa-arc"
version = "0.1.0"
description = "MSA-ARC: multimodal attitude recognition for smart elderly care information systems"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

# Stage B only. Training and evaluation run on the released feature tensors and
# need nothing that touches raw media.
dependencies = [
    "torch>=2.0",
    "transformers>=4.35,<5",
    "sentencepiece>=0.1.99",
    # mT5 ships a SentencePiece model; converting it needs protobuf.
    "protobuf>=3.20",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Stage A only. Needed where the raw interviews live, not to reproduce results.
features = [
    "jieba>=0.42",
    "librosa>=0.10",
    "soundfile>=0.12",
    "noisereduce>=3.0",
    "opencv-python>=4.8",
    "torchvision>=0.15",
    "face-recognition>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msa_arc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: requires downloading the mT5-base checkpoint",
]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "E501",
    # The project annotates with the typing module (Dict, List, Optional) rather
    # than PEP 585/604 builtins, for consistency across the codebase.
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    # `import torch.nn.functional as F` is the universal convention in PyTorch code.
    "N812",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
